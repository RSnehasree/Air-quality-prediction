<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Air Quality Prediction</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Cyber Tech Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
            background-color: #000d1a;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -10;
        }

        .card {
            background: rgba(235, 220, 220, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid #00eaff;
            border-radius: 18px;
            padding: 30px;
            width: 85%;
            max-width: 1200px;
            margin-top: 40px;
            animation: fadeIn 1s ease-in-out;
        }

        .form-control {
            background: rgba(0, 255, 255, 0.12);
            border: 1px solid #00eaff;
            color: #00f7ff;
            font-weight: 600;
        }

        button {
            background: #00eaff;
            border: none;
            font-weight: 800;
        }

        button:hover {
            background: #00ffff;
            box-shadow: 0px 0px 15px #00eaff;
        }

        .result {
            font-size: 22px;
            padding: 12px;
            margin-top: 20px;
            border-radius: 10px;
            font-weight: 800;
        }

        .class_0 { background-color: #00ff9d; color: #000; }
        .class_1 { background-color: #fffb00; color: #000; }
        .class_2 { background-color: #ff8c00; color: #000; }
        .class_3 { background-color: #ff0033; color: #fff; }
        .class_4 { background-color: #7a00ff; color: #fff; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <!-- ✨ Particle Background -->
    <div id="particles-js"></div>

    <div class="container d-flex justify-content-center">
        <div class="card text-center">
            <h2 class="fw-bold mb-4" style="color:#00eaff">🤖 Air Quality Prediction</h2>

            <form method="post">
                <div class="row g-3">
                    {% for col in feature_columns %}
                    <div class="col-md-3">
                        <input type="number" step="any" name="{{col}}" class="form-control"
                               placeholder="{{col}}" required>
                    </div>
                    {% endfor %}
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn px-4 py-2">Predict</button>
                </div>
            </form>

            {% if result %}
            <div class="result {{color_class}}">
                {{ result }}
            </div>
            {% endif %}
        </div>
    </div>

    <!-- Particle.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

    <!-- Particle Config Script -->
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {"value": 100},
                "color": {"value": "#00eaff"},
                "shape": {"type": "circle"},
                "opacity": {"value": 0.8},
                "size": {"value": 3},
                "line_linked": {
                    "enable": true,
                    "distance": 130,
                    "color": "#00eaff",
                    "opacity": 0.5,
                    "width": 1
                },
                "move": {"speed": 2}
            },
            "interactivity": {
                "events": {"onhover": {"enable": true, "mode": "grab"}}
            }
        });
    </script>

</body>
</html>
